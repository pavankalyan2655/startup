spring.application.name=telanganaPrivateJobs

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/Home}
spring.data.mongodb.auto-index-creation=true

server.port=${PORT:8080}

# Replace this development-only secret with a strong secret in deployed environments.
app.jwt.secret=${JWT_SECRET:tgpj-local-development-secret-change-before-deployment}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}