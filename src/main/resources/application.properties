spring.application.name=TGMagazine
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.mongodb.uri=${MONGODB_URI}/${MONGODB_DATABASE}
spring.data.mongodb.auto-index-creation=true
management.endpoints.web.exposure.include=health

server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
app.cloudinary.cloud-name=${APP_CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${APP_CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${APP_CLOUDINARY_API_SECRET:}